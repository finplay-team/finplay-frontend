# main 머지 시 정적 파일을 빌드해 S3에 자동 배포하는 CD 파이프라인 (이슈 #16)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 겹쳐 도는 배포가 서로의 업로드를 밀어내지 않도록 직렬화한다.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # VITE_* 환경변수는 빌드 시점에 번들 문자열로 박힌다 — 배포(업로드) 단계에 넣어도 이미 늦다.
      # 반드시 이 스텝에서 env로 주입한다.
      - name: 빌드
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # 위 환경변수가 실제로 번들에 들어갔는지 확인한다 — 값이 비어 있어도 빌드·배포는 조용히
      # 성공하고 브라우저에서만 API 호출이 깨지는 형태라, 배포 로그만 보면 못 잡는다.
      - name: API 베이스 URL이 번들에 반영됐는지 검증
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          # 값 자체가 비어 있으면 아래 grep이 빈 패턴("")으로 모든 줄에 매치돼 검증이 무의미해진다 —
          # grep 전에 먼저 값이 있는지부터 확인한다.
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL Variable이 비어 있다 — GitHub 리포지터리 설정을 확인한다"
            exit 1
          fi
          if ! grep -r "$VITE_API_BASE_URL" dist/assets/*.js > /dev/null; then
            echo "::error::번들(dist/assets/*.js)에 VITE_API_BASE_URL($VITE_API_BASE_URL)이 안 보인다 — 빌드 시점에 환경변수가 주입되지 않았을 수 있다"
            exit 1
          fi
          echo "번들에 API 베이스 URL 반영 확인됨"

      # 빈 빌드나 잘못된 산출물이 다음 단계의 --delete로 라이브 사이트를 지우는 것을 막는다.
      - name: 빌드 산출물 최소 검증
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html이 없다 — 빌드가 제대로 되지 않았다"
            exit 1
          fi
          FILE_COUNT=$(find dist -type f | wc -l)
          echo "빌드 산출물 파일 수: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "::error::빌드 산출물이 비정상적으로 적다($FILE_COUNT개) — S3 동기화를 중단한다"
            exit 1
          fi

      - name: AWS 자격 증명 (OIDC — 장기 액세스 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # index.html은 이름이 안 바뀌는데 배포마다 내용이 바뀐다(새 해시 자산을 가리켜야 한다) —
      # 캐시하면 사용자에게 옛 화면이 계속 보인다. 해시 붙은 자산은 내용이 바뀌면 파일명도 바뀌므로
      # 길게 캐시해도 안전하다. 그래서 둘을 분리해서, 반드시 이 순서로 올린다 — index.html을 먼저
      # 올리면 아직 없는 새 자산을 가리키는 순간이 생겨 그 사이 접속자가 404를 본다.
      - name: 해시 붙은 정적 자산 업로드 (장기 캐시, index.html 제외)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      - name: index.html 업로드 (캐시 금지, 항상 최신)
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: 배포 요약
        if: always()
        run: |
          {
            echo "### 프론트 배포 결과"
            echo "- 배포 커밋: \`${{ github.sha }}\`"
            echo "- 버킷: \`${{ vars.S3_BUCKET }}\`"
            echo "- 워크플로우 결과: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
